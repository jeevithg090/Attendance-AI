name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  smoke:
    name: API smoke test (Postgres)
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/attendai
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-123456
      NODE_ENV: test
      ENABLE_CRON: 'false'
      PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Create schema and seed demo data
        run: |
          npx drizzle-kit push --force
          npm run db:seed
      - name: Start API and exercise login
        run: |
          npm start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/api/health && break; sleep 1; done
          curl -sf localhost:3001/api/health
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3001/api/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"admin@bmsce.ac.in","password":"Admin@123"}')
          echo "login status: $status"
          test "$status" = "200"
      - name: API log
        if: always()
        run: cat api.log || true
